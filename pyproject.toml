[project]
name = "local-ml-vibes"
version = "0.1.0"
description = "A lightweight software-engineering workspace for local machine-learning models."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
models = [
    "torch>=2.0",
    "transformers>=4.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
